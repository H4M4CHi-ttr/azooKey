name: azooKey Dev unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_baseline:
        description: 'Also build the importer-free Phase A baseline'
        type: boolean
        default: false
  push:
    branches: [feature/dev-dictionary-import]
    paths-ignore: ['**/*.md']

permissions:
  contents: read

jobs:
  parser:
    if: github.repository == 'H4M4CHi-ttr/azooKey'
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Portable Swift parser tests
        shell: bash
        run: |
          set -o pipefail
          swift --version
          swift test --package-path DictionaryImport --parallel | tee parser-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-tests-${{ github.sha }}
          path: parser-tests.log
          retention-days: 1
  build:
    if: github.repository == 'H4M4CHi-ttr/azooKey'
    runs-on: macos-15-intel
    timeout-minutes: 60
    concurrency:
      group: dev-unsigned-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Select Xcode 26.3 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Restore build cache
        id: build-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            build/tests
            build/device
          key: dev-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('**/Package.swift', 'azooKey.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            dev-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('**/Package.swift', 'azooKey.xcodeproj/project.pbxproj') }}-
            dev-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
      - name: Check development identity
        run: |
          python3 scripts/verify_dev_build.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Checkout Phase A baseline without the importer
        if: inputs.build_baseline
        uses: actions/checkout@v6
        with:
          ref: d4d59619b2abcc4ffaa5072d36fb922367efbc50
          path: .baseline
          submodules: recursive
          lfs: true
          persist-credentials: false
      - name: Build and package Phase A baseline
        if: inputs.build_baseline
        run: |
          set -euo pipefail
          xcodebuild build -project .baseline/azooKey.xcodeproj -scheme MainApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/baseline-derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            | tee "$RUNNER_TEMP/baseline-build.log"
          mkdir -p build/baseline-ipa/Payload
          ditto "$RUNNER_TEMP/baseline-derived/Build/Products/Release-iphoneos/azooKey.app" build/baseline-ipa/Payload/azooKey.app
          find build/baseline-ipa/Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find build/baseline-ipa/Payload -name embedded.mobileprovision -delete
          (cd build/baseline-ipa && /usr/bin/zip -q -r -y ../azooKey-Dev-baseline-unsigned.ipa Payload)
          python3 scripts/verify_dev_build.py --ipa build/azooKey-Dev-baseline-unsigned.ipa
          shasum -a 256 build/azooKey-Dev-baseline-unsigned.ipa > build/azooKey-Dev-baseline-unsigned.ipa.sha256
      - name: Upload Phase A baseline
        if: inputs.build_baseline
        uses: actions/upload-artifact@v4
        with:
          name: azooKey-Dev-baseline-d4d59619
          path: |
            build/azooKey-Dev-baseline-unsigned.ipa
            build/azooKey-Dev-baseline-unsigned.ipa.sha256
          retention-days: 1
      - name: Test dictionary import package
        if: hashFiles('DictionaryImport/Package.swift') != ''
        run: swift test --package-path DictionaryImport --parallel
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'simulators.json').read_text())['devices']
          candidates = [d for runtime, values in devices.items() if 'iOS' in runtime for d in values if d['isAvailable'] and d['name'].startswith('iPhone')]
          assert candidates, 'No available iPhone simulator'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PY
      - name: Swift unit tests on iOS simulator
        run: |
          set -o pipefail
          xcodebuild test -project azooKey.xcodeproj -scheme azooKeyTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/tests -resultBundlePath build/DevTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tee "$RUNNER_TEMP/dev-tests.log"
      - name: Build unsigned iPhone Release
        run: |
          set -o pipefail
          xcodebuild build -project azooKey.xcodeproj -scheme MainApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            | tee "$RUNNER_TEMP/dev-build.log"
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          ditto build/device/Build/Products/Release-iphoneos/azooKey.app build/ipa/Payload/azooKey.app
          test -f build/ipa/Payload/azooKey.app/PlugIns/Keyboard.appex/Keyboard
          find build/ipa/Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find build/ipa/Payload -name embedded.mobileprovision -delete
          (cd build/ipa && /usr/bin/zip -q -r -y ../azooKey-Dev-unsigned.ipa Payload)
          python3 scripts/verify_dev_build.py --ipa build/azooKey-Dev-unsigned.ipa
          shasum -a 256 build/azooKey-Dev-unsigned.ipa > build/azooKey-Dev-unsigned.ipa.sha256
          python3 scripts/prepare_resign_ipa.py build/ipa/Payload/azooKey.app
          (cd build/ipa && /usr/bin/zip -q -r -y ../azooKey-Dev-resign.ipa Payload)
          python3 scripts/verify_dev_build.py --ipa build/azooKey-Dev-resign.ipa --allow-adhoc
          shasum -a 256 build/azooKey-Dev-resign.ipa > build/azooKey-Dev-resign.ipa.sha256
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: azooKey-Dev-unsigned-${{ github.sha }}
          path: |
            build/azooKey-Dev-unsigned.ipa
            build/azooKey-Dev-unsigned.ipa.sha256
            build/azooKey-Dev-resign.ipa
            build/azooKey-Dev-resign.ipa.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azooKey-Dev-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dev-tests.log
            ${{ runner.temp }}/dev-build.log
            ${{ runner.temp }}/baseline-build.log
            build/DevTests.xcresult
          retention-days: 1
      - name: Save build cache
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            build/tests
            build/device
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
